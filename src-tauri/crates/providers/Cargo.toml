[package]
name = "chelou-providers"
version = "0.1.0"
edition = "2021"

[dependencies]
chelou-manifest  = { path = "../manifest" }
pcloud           = "3.1.0"
reqwest          = { version = "0.12", features = ["json", "stream"] }
anyhow           = "1"
serde            = { version = "1", features = ["derive"] }
async-recursion  = "1"
uuid             = { version = "1", features = ["v4"] }
regex            = "1.12.4"
once_cell        = "1.21.4"
tokio            = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
serde_json = "1"
