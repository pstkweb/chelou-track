[package]
name = "chelou-audio-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow    = "1"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "mp3", "flac", "id3v1", "id3v2"] }
rubato    = "5"
rtrb      = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
json5      = "0.4"
