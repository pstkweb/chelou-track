[workspace]
members = [".", "crates/manifest", "crates/pcloud"]
resolver = "2"

[package]
name = "chelou-track"
version = "0.1.0"
description = "Lecteur de méthodes guitare (pCloud + AlphaTab)"
authors = ["Thomas Triboult"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chelou_track_lib"
crate-type = ["lib"]

[[bin]]
name = "chelou-track"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chelou-manifest  = { path = "crates/manifest" }
chelou-pcloud    = { path = "crates/pcloud" }
tauri        = { version = "2", features = [] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
keyring-core                 = "1"
anyhow       = "1"
thiserror    = "1"
log          = "0.4"
tauri-plugin-os = "2"
reqwest      = { version = "0.12", features = ["json"] }
open         = "5"
tauri-plugin-process = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-rust"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
