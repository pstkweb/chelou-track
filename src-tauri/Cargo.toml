[package]
name = "chelou-track"
version = "0.1.0"
description = "Lecteur de méthodes guitare (pCloud + AlphaTab)"
authors = ["Thomas Triboult"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chelou_track_lib"
crate-type = ["lib"]

[[bin]]
name = "chelou-track"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
reqwest      = { version = "0.12", features = ["json", "stream"] }
keyring      = "3"
anyhow       = "1"
thiserror    = "1"
log          = "0.4"
uuid             = { version = "1", features = ["v4"] }
async-recursion  = "1"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
