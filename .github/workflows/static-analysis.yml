name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts-lint:
    name: TypeScript lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ci

  rust-lint:
    name: Rust lint (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # cpal ASIO (Windows) : bindgen a besoin de libclang (LLVM, préinstallé sur le runner) ;
      # asio-sys télécharge lui-même le SDK ASIO Steinberg quand CPAL_ASIO_DIR n'est pas défini.
      - name: Point bindgen to LLVM
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
