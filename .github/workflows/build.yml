name: Build release

on:
  # Release publiée à la main depuis l'UI GitHub.
  release:
    types:
      - published
  # Appelé par release.yml (une release créée avec GITHUB_TOKEN ne déclenche pas `release`).
  workflow_call:
    inputs:
      release-id:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      # Sans id, tauri-action cherche la release par tag — introuvable si c'est un brouillon.
      - name: Check release id
        if: inputs.release-id == '' && github.event.release.id == ''
        run: |
          echo "::error::Aucun id de release reçu"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cpal ASIO (Windows) : bindgen a besoin de libclang (LLVM, préinstallé sur le runner) ;
      # asio-sys télécharge lui-même le SDK ASIO Steinberg quand CPAL_ASIO_DIR n'est pas défini.
      - name: Point bindgen to LLVM
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # bundleMediaFramework makes linuxdeploy bundle every GStreamer plugin it finds on the
      # runner, including gst-libav (the ffmpeg wrapper). That one ships broken in the AppImage:
      # with it bundled, playback fails outright ("Impossible de lire cette vidéo"); removing it
      # from the runner before bundling makes video work, and GStreamer falls back to the other
      # decoders that are bundled alongside it. Nothing else needs it — lesson videos are H.264.
      - name: Drop gst-libav so it isn't bundled
        if: runner.os == 'Linux'
        run: sudo find /usr/lib -name 'libgstlibav.so' -delete

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
          PCLOUD_CLIENT_ID: ${{ secrets.PCLOUD_CLIENT_ID }}
          PCLOUD_CLIENT_SECRET: ${{ secrets.PCLOUD_CLIENT_SECRET }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        with:
          releaseId: ${{ inputs.release-id || github.event.release.id }}
          tagName: ${{ inputs.tag || github.event.release.tag_name }}
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch]_[mode][setup][ext]"