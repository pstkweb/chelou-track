name: Rust tests

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/rust-test.yml"

jobs:
  unit-tests:
    name: Unit tests (no system deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo test -p chelou-manifest -p chelou-providers
